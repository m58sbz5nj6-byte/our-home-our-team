<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212326"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json?v=8"><link rel="icon" type="image/svg+xml" href="burgess-icon.svg"><link rel="apple-touch-icon" href="burgess-icon.svg"><link rel="stylesheet" href="style.css?v=11"><title>Our Home, Our Team</title></head><body class="wall-layout">
<header><img src="burgess-icon.svg" alt=""><div><h1>Our Home, Our Team</h1></div><button id="logout" class="secondary" hidden>Sign out</button></header>
<main>
  <p id="notice" role="status">Connecting…</p>
  <section id="login" hidden>
    <h2>Household sign-in</h2>
    <form id="signin">
      <label>Email<input id="email" type="email" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button>Sign in</button>
    </form>
  </section>
  <section id="home" hidden>
    <section id="dashboard">
      <div class="wall-toolbar"><h2 id="dashboardTitle" tabindex="-1">Chores outstanding</h2><span id="week"></span></div>
      <div id="people" class="family-grid"></div>
      <div class="wall-tools">
        <button id="manageTab" class="secondary" hidden>Manage chores</button>
        <button id="historyTab" class="secondary">History</button>
      </div>
    </section>
    <section id="detail" hidden>
      <div class="wall-toolbar detail-heading"><button id="back" class="secondary">← Back</button><h2 id="viewTitle" tabindex="-1"></h2></div>
      <div id="detailControls" class="wall-tools"></div>
      <div id="content"></div>
    </section>
  </section>
</main>
<script type="module" src="wall-dashboard.js?v=9"></script>
</body></html>
