<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176d67"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="stylesheet" href="style.css"><title>Our Home, Our Team</title></head><body><header><img src="icon.png" alt=""><div><h1>Our Home, Our Team</h1><small>We work together, so we have more time together.</small></div></header><main><p id="notice" role="status">Connecting…</p><section id="login" hidden><h2>Welcome home</h2><form id="signin"><label>Email or family login<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></section><section id="home" hidden><div class="bar"><strong id="who"></strong><button id="logout" class="secondary">Sign out</button></div><section class="panel"><div class="bar"><h2 id="week"></h2><span id="date"></span></div><h3>Team progress <span id="percent"></span></h3><progress id="progress" max="100" value="0"></progress><p id="count"></p><div id="people" class="people"></div></section><nav id="tabs"><button data-tab="today">Today</button><button data-tab="week">This week</button><button data-tab="all">All due</button><button data-tab="history">History</button><button data-tab="manage" id="manageTab" hidden>Manage</button></nav><div class="bar" id="filters"><label>Show <select id="filter"><option value="all">Everyone</option><option value="me">My jobs</option><option value="dad">Dad</option><option value="mum">Mum</option><option value="child1">Child 1</option><option value="child2">Child 2</option><option value="shared">Shared</option></select></label><label><input type="checkbox" id="hideDone"> Hide done</label></div><div id="content"></div></section></main><footer>Everyone contributes. Everyone helps.</footer><script type="module" src="app.js"></script></body></html>
