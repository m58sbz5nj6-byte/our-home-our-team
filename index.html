<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#212326"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json?v=8"><link rel="icon" type="image/svg+xml" href="burgess-icon.svg"><link rel="apple-touch-icon" href="burgess-icon.svg"><link rel="stylesheet" href="style.css?v=11"><link rel="stylesheet" href="calendar-layout.css?v=2"><title>Our Home, Our Team</title></head><body class="wall-layout">
<header><h1><time id="headerDate"></time></h1></header>
<div class="app-shell">
<nav class="side-menu" aria-label="Household">
  <button id="dashboardTab" class="secondary" hidden><svg class="menu-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M3 4h18v12H3z M8 21h8 M12 16v5"/></svg> Dashboard</button>
  <button id="calendarTab" class="secondary" hidden><svg class="menu-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M3 6h18v15H3z M3 10h18 M8 3v5 M16 3v5 M7 14h2m3 0h2m3 0h1M7 17h2m3 0h2"/></svg> Calendar</button>
  <button id="manageTab" class="secondary" hidden><svg class="menu-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M5 3h14v18H5z M8 8l1 1 2-2 M13 8h3 M8 14l1 1 2-2 M13 14h3"/></svg> Manage chores</button>
  <button id="historyTab" class="secondary" hidden><svg class="menu-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7 M3 5v6h6 M12 7v5l3 2"/></svg> History</button>
  <button id="signinTab" class="secondary account"><svg class="menu-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M14 4h6v16h-6 M3 12h12 M11 8l4 4-4 4"/></svg> Sign in</button>
  <button id="logout" class="secondary account" hidden><svg class="menu-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M10 4H4v16h6 M9 12h12 M17 8l4 4-4 4"/></svg> Sign out</button>
</nav>
<main>
  <p id="notice" role="status">Connecting…</p>
  <section id="login" hidden>
    <h2>Household sign-in</h2>
    <form id="signin">
      <label>Email<input id="email" type="email" required autocomplete="username"></label>
      <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
      <button>Sign in</button>
    </form>
  </section>
  <section id="home" hidden>
    <section id="dashboard">
      <div class="wall-toolbar"><h2 id="dashboardTitle" tabindex="-1">Chores outstanding</h2><span id="week"></span></div>
      <div id="people" class="family-grid"></div>

    </section>
    <section id="calendarView" hidden>
      <div class="calendar-panel">
        <div class="wall-toolbar"><h2 id="calendarTitle" tabindex="-1"></h2>
          <div class="calendar-controls">
            <button id="previousMonth" class="secondary" aria-label="Previous month">‹</button>
            <button id="currentMonth" class="secondary">Today</button>
            <button id="nextMonth" class="secondary" aria-label="Next month">›</button>
          </div>
        </div>
        <div id="calendarGrid" class="month-grid"></div>
      </div>
      <aside class="calendar-panel"><h2>Upcoming</h2><p>Connect a calendar to see upcoming events and who they’re for.</p></aside>
    </section>
    <section id="detail" hidden>
      <div class="wall-toolbar detail-heading"><button id="back" class="secondary">← Back</button><h2 id="viewTitle" tabindex="-1"></h2></div>
      <div id="detailControls" class="wall-tools"></div>
      <div id="content"></div>
    </section>
  </section>
</main>
</div>
<script type="module" src="calendar-dashboard.js"></script>
</body></html>
