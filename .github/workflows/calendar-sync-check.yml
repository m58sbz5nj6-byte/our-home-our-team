name: Calendar sync checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [private-family-calendar]
    paths:
      - calendar-sync/**
      - .github/workflows/calendar-sync-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calendar-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run dry-run
